# hide-idle-apps tunables.
#
# Read at runtime by custom_bins/hide-idle-apps and by
# scripts/cleanup/setup_hide_idle_apps.sh (which schedules it). Environment
# variables of the same name override these. Editing this file takes effect on
# the next poll; changing the poll interval needs a redeploy to rewrite the
# launchd job.
#
# Which apps are never hidden lives elsewhere: the [hide-idle-exclude] section of
# config/clear_mac_apps.conf.

# Minutes an app must be continuously COVERED (see below, and not frontmost)
# before it is hidden. An app that is frontmost or sufficiently visible is never
# hidden, whatever this is set to.
HIDE_IDLE_MINUTES=15

# Seconds between polls. Also used for gap detection: a gap longer than 3x this
# means polls were skipped (sleep, logout), so all timers restart instead.
HIDE_IDLE_POLL_SECONDS=60

# Percentage of a window's area that must be visible (not covered by opaque
# windows in front of it) for the app to count as on screen. Below this, the app
# is "covered" and its idle timer runs. Lower is more conservative: 0 would mean
# a single visible pixel keeps an app alive forever; 100 would hide anything even
# slightly overlapped. Focus is checked separately, so an app you are actually
# using is never hidden however covered it is.
#
# A WHOLE PERCENT, e.g. 40 - not 0.4, which is a valid value meaning 0.4% and
# would quietly restore the "one visible pixel keeps an app alive" behaviour this
# threshold exists to replace. Anything outside 0-100 is rejected: the job then
# hides nothing and logs why, rather than falling back to a default.
HIDE_IDLE_MIN_VISIBLE_PERCENT=40
